# Test 1.13: can a job approve a pull request with its own token?
name: probe-approve
run-name: probe-approve ${{ github.sha }}
on:
  push:
    branches: ['trigger/probe-approve/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Try to approve pull request 2 with the token of the job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/2/reviews" \
            -d '{"event":"APPROVE","body":"probe: approval by a job"}')
          echo "RESULT job-token approve: HTTP $code"
          head -c 600 out.json
