# Tests 1.7 and 1.8: a run that takes long. limit_minutes is the time limit of the job.
name: slow
run-name: slow ${{ inputs.run_key || github.ref_name }}
on:
  push:
    branches: ['trigger/slow/**']
  workflow_dispatch:
    inputs:
      run_key:
        required: true
      seconds:
        required: true
        default: "240"
      limit_minutes:
        required: true
        default: "1"
permissions:
  contents: read
concurrency:
  group: slow-${{ inputs.run_key || github.ref_name }}
  cancel-in-progress: false
jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.limit_minutes || (contains(github.ref_name, 'long') && '10' || '1')) }}
    steps:
      - run: echo "run_key=${{ inputs.run_key || github.ref_name }}"; sleep ${{ inputs.seconds || 240 }}
